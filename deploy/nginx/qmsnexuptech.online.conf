# Production site config for https://qmsnexuptech.online
# Install: copy to /etc/nginx/sites-available/qmsnexuptech.online
#          ln -sf ... /etc/nginx/sites-enabled/
#          nginx -t && systemctl reload nginx
#
# Critical for public display SSE:
# - /api/ is proxied directly to NestJS (skip Next.js rewrite hop)
# - dedicated /events location disables buffering + gzip

upstream qms_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream qms_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name qmsnexuptech.online www.qmsnexuptech.online;
    return 301 https://qmsnexuptech.online$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qmsnexuptech.online www.qmsnexuptech.online;

    # Adjust cert paths to match this VPS (certbot defaults shown)
    ssl_certificate     /etc/letsencrypt/live/qmsnexuptech.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qmsnexuptech.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Public display SSE — most specific match first
    location ~ ^/api/public/displays/[^/]+/events$ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://qms_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        gzip off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no always;
        add_header Cache-Control "no-cache, no-transform" always;
    }

    # All other API traffic → NestJS directly (avoids Next rewrite buffering)
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://qms_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://qms_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
