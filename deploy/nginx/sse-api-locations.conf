# QMS public-display SSE — include inside the HTTPS server block for qmsnexuptech.online
# BEFORE any catch-all "location /".
#
# This location must win over a catch-all that proxies to Next.js.
# It terminates SSE at NestJS (:4000) with buffering disabled.

location ~ ^/api/public/displays/[^/]+/events$ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
    gzip off;
    chunked_transfer_encoding off;
    proxy_connect_timeout 60s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
