# Production-ready Docker Compose
# Note: For true production, use cloud-managed services (RDS, ElastiCache, etc.)
# This is suitable for staging environments or single-server production deployments

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: queue-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-queue_management}
      POSTGRES_USER: ${DATABASE_USER:-queue_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change-me-in-production}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-queue_user} -d ${DATABASE_NAME:-queue_management}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - queue-network
    # Production: Enable SSL
    # command: -c ssl=on -c ssl_cert_file=/var/lib/postgresql/server.crt -c ssl_key_file=/var/lib/postgresql/server.key

  redis:
    image: redis:7-alpine
    container_name: queue-management-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --requirepass "${REDIS_PASSWORD:-change-me-in-production}"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - queue-network
    # Production: Additional security
    # command: >
    #   redis-server
    #   --appendonly yes
    #   --requirepass [STRONG_PASSWORD]
    #   --maxmemory 2gb
    #   --maxmemory-policy allkeys-lru
    #   --bind 127.0.0.1

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: queue-management-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-4000}:4000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DATABASE_URL: "postgresql://${DATABASE_USER:-queue_user}:${DATABASE_PASSWORD:-change-me}@postgres:5432/${DATABASE_NAME:-queue_management}?schema=public&sslmode=${DATABASE_SSL_MODE:-disable}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-change-me}@redis:6379/0"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-replace-with-production-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-replace-with-production-secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      TOKEN_TIME_ZONE: ${TOKEN_TIME_ZONE:-Asia/Kolkata}
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-noop}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - queue-network
    # Production: Resource limits
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 1G
    #     reservations:
    #       cpus: '1'
    #       memory: 512M

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: queue-management-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_URL: ${API_URL:-http://localhost:4000}
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - queue-network
    # Production: Resource limits
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1'
    #       memory: 512M
    #     reservations:
    #       cpus: '0.5'
    #       memory: 256M

  # Optional: Reverse proxy for production
  # nginx:
  #   image: nginx:alpine
  #   container_name: queue-management-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl/cert.pem:/etc/nginx/cert.pem:ro
  #     - ./ssl/key.pem:/etc/nginx/key.pem:ro
  #   depends_on:
  #     - api
  #     - web
  #   networks:
  #     - queue-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  queue-network:
    driver: bridge
